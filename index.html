<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Listings</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="jobContainer"></div>

  <!-- Modal Form -->
  <div id="jobModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Contact Us About This Position</h2>
      <form id="jobForm" action="https://n8n.srv738335.hstgr.cloud/webhook/ec7b2ccf-6007-4769-9f44-5b45bc387004" method="POST">

        <label for="name">Your Name</label>
        <input type="text" name="name" required />

        <label for="phone">Your Phone Number</label>
        <input type="tel" name="phone" required />

        <label for="email">Your Email</label>
        <input type="email" name="email" required />
        
        <label for="position">Position</label>
        <input type="text" name="position" id="position" readonly />

        <label for="location">Location</label>
        <input type="text" name="location" id="location" readonly />

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script>
    fetch("jobs.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("jobContainer").innerHTML = html;

        // Modal logic
        const modal = document.getElementById("jobModal");
        const closeBtn = document.querySelector(".close");
        const positionField = document.getElementById("position");
        const locationField = document.getElementById("location");

        document.querySelectorAll(".card-link").forEach(card => {
          card.addEventListener("click", e => {
            e.preventDefault();
            const link = new URL(card.href);
            const position = link.searchParams.get("position");
            const location = link.searchParams.get("location");

            positionField.value = decodeURIComponent(position);
            locationField.value = decodeURIComponent(location);

            modal.style.display = "block";
          });
        });

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = e => {
          if (e.target == modal) modal.style.display = "none";
        };
      });
  </script>
</body>
</html>
